name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Buildozer & Dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.33
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf automake libtool ccache
      - name: Accept Android Licenses Automatically
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          buildozer android licenses || true
      - name: Build with Buildozer
        run: |
          export P4A_FORCE_BUILD_ALL=1
          buildozer android debug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phoneremote-APK
          path: bin/*.apk
